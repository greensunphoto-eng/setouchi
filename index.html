<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세토내해 미술여행 — 포항가우디 사전수업 게임</title>
<style>
:root{
  --ink:#131a26; --ink2:#1c2534; --deep:#0d1420;
  --sea:#2e7d83; --hblue:#4a7ba6; --hblue2:#7fa8c9;
  --paper:#f4f2e9; --pink:#c8402f; --gold:#d9a441;
  --txt:#e8ecf2; --txt-dim:#93a1b5; --ok:#4e9e6c; --bad:#c05a4a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--deep); color:var(--txt);
  font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif;
  min-height:100vh; overflow-x:hidden;
}
.serif{font-family:"Nanum Myeongjo","Noto Serif KR",Batang,"Apple Myungjo",AppleMyungjo,serif}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:-2}
#glveil{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(13,20,32,.14) 0%,rgba(13,20,32,0) 40%,rgba(13,20,32,.42) 100%);pointer-events:none}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;
  padding:0 0 calc(92px + env(safe-area-inset-bottom))}

/* ── 상단 상태바 ── */
#hud{position:sticky;top:0;z-index:30;background:rgba(13,20,32,.9);backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(127,168,201,.25);padding:10px 14px 9px;display:none}
#hud .where{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#hud .day{font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:700;white-space:nowrap}
#hud .loc{font-size:14.5px;font-weight:800;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hud .clock{font-size:12px;color:var(--txt-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
#stats{display:grid;grid-template-columns:1.35fr .9fr .9fr 1.1fr;gap:6px;margin-top:8px}
.stat{background:rgba(28,37,52,.92);border:1px solid rgba(127,168,201,.18);border-radius:6px;padding:5px 8px 6px;position:relative;overflow:hidden}
.stat .lb{font-size:9.5px;letter-spacing:.14em;color:var(--txt-dim)}
.stat .vl{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.hpbar{height:4px;background:#2a3a52;border-radius:2px;margin-top:3px;overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--bad),var(--ok));border-radius:2px;transition:width .5s}
.pop{position:absolute;right:6px;top:2px;font-size:12px;font-weight:800;opacity:0;pointer-events:none}
.pop.show{animation:rise 1.1s ease forwards}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}25%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.pop.up{color:#7ed6a0}.pop.dn{color:#ff9c8a}

/* ── 장면 카드 ── */
#stage{flex:1;padding:16px 14px 8px;display:flex;flex-direction:column;justify-content:flex-start}
.scene{background:var(--paper);color:#2a2a22;border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.55);
  padding:18px 18px 18px;position:relative;animation:cardin .5s cubic-bezier(.2,.9,.3,1)}
@keyframes cardin{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.scene .kicker{font-size:10px;letter-spacing:.22em;color:#8a7f63;font-weight:700;margin-bottom:6px}
.scene h2{margin:0 0 10px;font-size:19px;line-height:1.4;color:#1d2a3a;text-wrap:balance}
.scene p{margin:0 0 10px;font-size:14.5px;line-height:1.78;max-width:62ch;white-space:pre-line}
.scene .tip{font-size:12.5px;line-height:1.65;color:#69614c;background:#ece7d6;border-left:3px solid var(--gold);
  padding:8px 10px;border-radius:0 6px 6px 0;margin:12px 0 0}
figure.ph{margin:0 0 12px;border-radius:8px;overflow:hidden;border:1px solid #d8d2bd;background:#fff}
figure.ph img{display:block;width:100%;height:auto}
figure.ph figcaption{font-size:10.5px;color:#8a8268;padding:5px 9px;background:#faf8f0;letter-spacing:.02em}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:16px}
button.ch{display:block;width:100%;text-align:left;font:inherit;font-size:14.5px;line-height:1.5;font-weight:700;
  color:#1d2a3a;background:#fff;border:1.5px solid #cfc9b4;border-radius:8px;padding:13px 14px;cursor:pointer;
  transition:transform .08s, border-color .15s}
button.ch:active{transform:scale(.985)}
button.ch:hover{border-color:var(--hblue)}
button.ch:focus-visible{outline:3px solid var(--hblue);outline-offset:2px}
button.ch .sub{display:block;font-size:12px;font-weight:400;color:#7d7660;margin-top:3px}
button.primary{background:var(--pink);color:#fff;border-color:var(--pink);text-align:center}
.fb{margin-top:14px;border-radius:8px;padding:12px 13px;font-size:13.5px;line-height:1.7;animation:cardin .3s ease}
.fb.good{background:#e4efe2;border:1.5px solid #9dc39a;color:#2c4a2e}
.fb.bad{background:#f4e2dc;border:1.5px solid #d8a396;color:#5e3128}
.fb.info{background:#e3ebf2;border:1.5px solid #a9c0d4;color:#2b4258}
.fb b{display:block;margin-bottom:4px}
.fb,button.primary{scroll-margin-bottom:104px}

/* 도장 */
#stampfx{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;pointer-events:none}
.stamp{width:190px;height:190px;border:6px double var(--pink);border-radius:50%;color:var(--pink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  background:rgba(244,242,233,.93);transform:rotate(-11deg);
  box-shadow:0 18px 50px rgba(0,0,0,.5);animation:thunk .5s cubic-bezier(.2,1.6,.4,1)}
.stamp .no{font-size:11px;letter-spacing:.28em;font-weight:700}
.stamp .nm{font-size:19px;font-weight:900;line-height:1.3;padding:0 14px}
.stamp .dt{font-size:11px;letter-spacing:.12em}
@keyframes thunk{0%{transform:rotate(-11deg) scale(2.1);opacity:0}60%{transform:rotate(-11deg) scale(.96);opacity:1}100%{transform:rotate(-11deg) scale(1)}}

/* 데이 전환 */
#dayfx{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;flex-direction:column;
  background:rgba(13,20,32,.88);backdrop-filter:blur(4px);text-align:center;padding:20px}
#dayfx .d1{font-size:13px;letter-spacing:.4em;color:var(--gold);font-weight:700}
#dayfx .d2{font-size:46px;font-weight:900;color:#fff;margin:8px 0 6px}
#dayfx .d3{font-size:14px;color:var(--txt-dim);line-height:1.6}
#dayfx.on{display:flex;animation:dayin 1.8s ease forwards}
@keyframes dayin{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}

/* 하단 독 */
#dock{position:fixed;bottom:0;left:0;right:0;z-index:40;background:linear-gradient(0deg,rgba(13,20,32,.85),rgba(13,20,32,0))}
#dock .in{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px calc(12px + env(safe-area-inset-bottom));gap:8px}
#prog{flex:1;height:5px;background:rgba(127,168,201,.2);border-radius:3px;overflow:hidden;min-width:40px}
#prog i{display:block;height:100%;width:0;background:var(--gold);border-radius:3px;transition:width .5s}
.dockbtn{font:inherit;font-size:12px;font-weight:700;color:var(--txt);background:rgba(28,37,52,.95);
  border:1px solid rgba(127,168,201,.3);border-radius:20px;padding:11px 15px;cursor:pointer;white-space:nowrap}
.dockbtn:focus-visible{outline:2px solid var(--hblue)}

/* 타이틀 */
#title{padding:52px 22px 30px;text-align:center;display:flex;flex-direction:column;align-items:center}
#title .over{font-size:11px;letter-spacing:.34em;color:var(--gold);font-weight:700;margin-bottom:14px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#title h1{margin:0;font-size:42px;line-height:1.22;font-weight:900;color:#fff;text-wrap:balance;letter-spacing:.02em;
  text-shadow:0 4px 24px rgba(0,0,0,.55);animation:floaty 5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
#title h1 .blue{color:var(--hblue2)}
#title .sub{margin:14px 0 4px;font-size:14px;color:#c9d4e2;line-height:1.7;text-shadow:0 2px 10px rgba(0,0,0,.7)}
#title .meta{font-size:12px;color:var(--txt-dim);letter-spacing:.06em;margin-top:2px;text-shadow:0 2px 8px rgba(0,0,0,.7)}
#title .start{margin-top:28px;width:min(320px,86%);font-size:16px;font-weight:800;padding:16px;border-radius:10px;
  background:var(--pink);color:#fff;border:none;cursor:pointer;box-shadow:0 10px 30px rgba(200,64,47,.45);font-family:inherit}
#title .start:active{transform:scale(.98)}
#title .small{margin-top:14px;font-size:11.5px;color:var(--txt-dim);text-shadow:0 2px 8px rgba(0,0,0,.7)}
.torii{font-size:54px;margin-bottom:8px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.5));animation:floaty 5s ease-in-out infinite}

/* 모달 공통 */
.modal{position:fixed;inset:0;z-index:70;background:rgba(13,20,32,.9);display:none;align-items:center;justify-content:center;padding:18px}
.modal .bin{background:var(--paper);color:#2a2a22;border-radius:12px;max-width:460px;width:100%;max-height:84vh;overflow:auto;padding:18px}
.modal h3{margin:0 0 12px;font-size:16px;color:#1d2a3a}
.modal .close{margin-top:14px;width:100%;font:inherit;font-weight:700;padding:11px;border-radius:8px;border:1.5px solid #cfc9b4;background:#fff;cursor:pointer}
#bookgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
#bookgrid .cell{aspect-ratio:1;border:2px dashed #c9c2aa;border-radius:50%;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:10.5px;line-height:1.3;color:#a89f83;padding:6px}
#bookgrid .cell.got{border:3px double var(--pink);color:var(--pink);font-weight:800;transform:rotate(-8deg);background:#fff}

/* 지도 */
#mapsvg{width:100%;height:auto;display:block;border-radius:8px;background:linear-gradient(180deg,#bcd6e4,#9ec4d8)}
.land{fill:#d8d2b8;stroke:#b9b294;stroke-width:1}
.route{fill:none;stroke:#c8402f;stroke-width:2;stroke-dasharray:5 4;stroke-linecap:round;opacity:.85}
.bridge{fill:none;stroke:#5b7c99;stroke-width:1.6;stroke-dasharray:2 3}
.pin{fill:#fff;stroke:#8a7f63;stroke-width:1.4}
.pin.visited{fill:var(--pink);stroke:#8f2418}
.pin.here{fill:var(--gold);stroke:#8f6a1c;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{r:6}50%{r:8}}
.plabel{font-size:9.5px;fill:#3d4a5c;font-weight:700;font-family:inherit}
.sealbl{font-size:9px;fill:#5b7c99;letter-spacing:.2em}

/* 엔딩 */
.report .grade{font-size:64px;font-weight:900;color:var(--pink);line-height:1;margin:6px 0 2px}
.report .gsub{font-size:13px;color:#69614c;margin-bottom:12px}
.axes{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.axis .an{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#4a4536;margin-bottom:3px}
.axis .ab{height:8px;background:#e2dcc8;border-radius:4px;overflow:hidden}
.axis .ab i{display:block;height:100%;background:var(--hblue);border-radius:4px;transition:width 1s ease}
.rline{display:flex;justify-content:space-between;font-size:13px;padding:7px 2px;border-bottom:1px dashed #d5cfba}
.rline b{font-variant-numeric:tabular-nums}
.mihwal{margin-top:14px;background:#fff;border:1.5px solid #cfc9b4;border-radius:8px;padding:12px 13px;font-size:13px;line-height:1.8;color:#333}
.mihwal .mh{font-size:11px;letter-spacing:.2em;color:#8a7f63;font-weight:700;margin-bottom:6px}

@media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important} }
@media (max-width:380px){ #title h1{font-size:34px} .scene h2{font-size:17px} }
</style>

<canvas id="gl"></canvas>
<div id="glveil"></div>

<div id="app">
  <header id="hud">
    <div class="where">
      <span class="day" id="h-day">DAY 1</span>
      <span class="loc" id="h-loc">김해국제공항</span>
      <span class="clock" id="h-time">14:30</span>
    </div>
    <div id="stats">
      <div class="stat"><div class="lb">체력</div><div class="vl" id="s-hp">60</div><div class="hpbar"><i id="s-hpbar"></i></div><span class="pop" id="p-hp"></span></div>
      <div class="stat"><div class="lb">관찰</div><div class="vl" id="s-obs">0</div><span class="pop" id="p-obs"></span></div>
      <div class="stat"><div class="lb">기록</div><div class="vl" id="s-rec">0</div><span class="pop" id="p-rec"></span></div>
      <div class="stat"><div class="lb">지갑</div><div class="vl" id="s-yen">¥10,000</div><span class="pop" id="p-yen"></span></div>
    </div>
  </header>

  <main id="stage"></main>
  <div id="stampfx"></div>
  <div id="dayfx"><div class="d1" id="df1"></div><div class="d2 serif" id="df2"></div><div class="d3" id="df3"></div></div>

  <div class="modal" id="book"><div class="bin">
    <h3>방문지 스탬프북</h3>
    <div id="bookgrid"></div>
    <button type="button" class="close" data-close="book">닫기</button>
  </div></div>

  <div class="modal" id="map"><div class="bin">
    <h3>여정 지도 — 세토내해</h3>
    <svg id="mapsvg" viewBox="0 0 360 250" role="img" aria-label="세토내해 여정 지도">
      <text class="sealbl" x="150" y="132">SETO INLAND SEA</text>
      <path class="land" d="M-5,-5 L365,-5 L365,52 Q330,44 300,50 Q272,56 240,48 Q205,40 175,52 Q150,62 118,54 Q80,44 40,56 Q15,62 -5,54 Z"/>
      <path class="land" d="M-5,255 L365,255 L365,196 Q340,188 310,196 Q280,204 250,196 Q225,188 195,198 Q165,208 130,198 Q95,186 60,196 Q28,206 -5,196 Z"/>
      <ellipse class="land" cx="152" cy="112" rx="16" ry="9"/>
      <ellipse class="land" cx="112" cy="96" rx="8" ry="5"/>
      <ellipse class="land" cx="196" cy="94" rx="7" ry="4.5"/>
      <ellipse class="land" cx="238" cy="120" rx="9" ry="5"/>
      <ellipse class="land" cx="286" cy="140" rx="7" ry="4"/>
      <path class="bridge" d="M120,180 L152,118"/>
      <path class="bridge" d="M152,106 L186,62"/>
      <path class="bridge" d="M262,72 L282,192"/>
      <path class="route" id="routeline" d="M38,212 L118,182 L152,112 L188,60 L252,54 L264,76 L284,194 L150,222 L74,196 L40,208"/>
      <g id="pins"></g>
    </svg>
    <p style="font-size:11.5px;color:#69614c;margin:10px 2px 0;line-height:1.6">
      <span style="color:var(--pink);font-weight:800">●</span> 다녀온 곳 ·
      <span style="color:var(--gold);font-weight:800">●</span> 지금 위치 ·
      <span style="color:#5b7c99">┈</span> 다리 (시마나미카이도 · 세토대교)
    </p>
    <button type="button" class="close" data-close="map">닫기</button>
  </div></div>

  <nav id="dock"><div class="in">
    <button type="button" class="dockbtn" id="stampbook">도장 <span id="stampcnt">0</span>/8</button>
    <button type="button" class="dockbtn" id="mapbtn">지도</button>
    <div id="prog"><i id="progbar"></i></div>
    <button type="button" class="dockbtn" id="mute">소리 켬</button>
  </div></nav>
</div>

  function ensure(){
    if(ctx) return;

    master=ctx.createGain();master.gain.value=1;master.connect(ctx.destination);
    bgmGain=ctx.createGain();bgmGain.gain.value=1;bgmGain.connect(master);
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&ctx.state==='suspended') ctx.resume(); });
  }
  function tone(fr,t0,dur,wave,vol,dest){

    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol,t0+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g);g.connect(dest||master);o.start(t0);o.stop(t0+dur+.05);
  }

    const n=ctx.createBufferSource(),b=ctx.createBuffer(1,Math.max(1,ctx.sampleRate*dur|0),ctx.sampleRate);
    const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    n.buffer=b;
    const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=fc||900;
    const g=ctx.createGain();
    g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);

    else if(name==='good'){[523,659,784].forEach((fr,i)=>tone(fr,t+i*.07,.16,'triangle',.07));}
    else if(name==='bad'){tone(160,t,.28,'sawtooth',.06);tone(151,t,.28,'sawtooth',.05);}
    else if(name==='coin'){tone(1245,t,.06,'square',.05);tone(1865,t+.06,.12,'square',.05);}
    else if(name==='stamp'){noise(t,.14,.3,700);tone(95,t,.16,'sine',.22);}
    else if(name==='page'){noise(t,.1,.08,2400);}

  }

    if(!ctx||cur===key) return;

    const p=P[key];if(!p) return;

      if(muted||ctx.state!=='running') return;

      if(step%8===0) tone(f(p.bass),t,stepDur*7,'sine',.035,bgmGain);
      step++;
    },stepDur*1000);
  }
  return {
    unlock(){ensure();if(ctx.state==='suspended')ctx.resume();},
    sfx,playBgm,
    toggle(){muted=!muted;return muted;},
    get muted(){return muted;}
  };
})();

const Sea=(()=>{
  const cv=document.getElementById('gl');
  const gl=cv.getContext('webgl',{antialias:false,alpha:false});
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!gl){ cv.style.display='none'; document.body.style.background='linear-gradient(180deg,#0d1420,#1b3550)'; return {set(){},}; }
  const VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const FS=[
  'precision mediump float;',
  'uniform vec2 R;uniform float T;',
  'uniform vec3 skyT,skyB,seaA,seaB,sunC;',
  'uniform vec2 sunP;uniform float nite;',
  'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
  'float isl(float x,float c,float w,float h){float d=(x-c)/w;return h*exp(-d*d);}',
  'void main(){',
  ' vec2 uv=gl_FragCoord.xy/R;',
  ' float hz=0.62;',
  ' vec3 col;',
  ' if(uv.y>hz){',
  '  float t=(uv.y-hz)/(1.-hz);',
  '  col=mix(skyB,skyT,t);',
  '  float sd=distance(uv*vec2(R.x/R.y,1.),sunP*vec2(R.x/R.y,1.));',
  '  col+=sunC*exp(-sd*18.)*1.2+sunC*exp(-sd*4.)*0.25;',
  '  if(nite>0.05){',
  '   vec2 sg=vec2(48.,26.)*vec2(R.x/R.y,1.);',
  '   vec2 sp=floor(uv*sg);',
  '   vec2 sf=fract(uv*sg)-0.5;',
  '   float h=hash(sp);',
  '   float st=step(0.93,h)*smoothstep(0.22,0.03,length(sf));',
  '   float tw=0.55+0.45*sin(T*2.+h*40.);',
  '   col+=vec3(1.,0.95,0.85)*st*tw*nite*smoothstep(hz+0.04,0.9,uv.y);',
  '  }',
  '  float sil=isl(uv.x,0.22,0.09,0.045)+isl(uv.x,0.55,0.06,0.03)+isl(uv.x,0.8,0.11,0.06);',
  '  if(uv.y<hz+sil){col=mix(skyB*0.45,skyB*0.7,(uv.y-hz)/0.08);}',
  ' } else {',
  '  float d=(hz-uv.y)/hz;',
  '  col=mix(seaA,seaB,d);',
  '  float w=sin(uv.y*150.+sin(uv.x*22.+T*1.2)*3.+T*1.8);',
  '  col+=vec3(0.45,0.6,0.66)*smoothstep(0.88,1.,w)*0.07*(1.-d);',
  '  float gl2=exp(-abs(uv.x-sunP.x)*9.)*(1.-d);',
  '  float fl=smoothstep(0.5,1.,sin(uv.y*170.+T*3.+sin(uv.x*60.)*2.));',
  '  col+=sunC*gl2*fl*0.30;',
  '  col=mix(col,skyB,smoothstep(hz-0.03,hz,uv.y)*0.5);',
  ' }',
  ' gl_FragColor=vec4(col,1.);',
  '}'].join('\n');
  function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;}
  const pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(pr);gl.useProgram(pr);
  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const lp=gl.getAttribLocation(pr,'p');
  gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
  const U={};['R','T','skyT','skyB','seaA','seaB','sunC','sunP','nite'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
  const MOODS={
    travel:{skyT:[.45,.66,.82],skyB:[.78,.86,.90],seaA:[.34,.62,.66],seaB:[.10,.26,.38],sunC:[1,.95,.75],sunP:[.72,.83],nite:0},
    museum:{skyT:[.55,.66,.76],skyB:[.82,.84,.85],seaA:[.42,.60,.64],seaB:[.16,.30,.40],sunC:[.9,.9,.85],sunP:[.6,.78],nite:0},
    onsen:{skyT:[.30,.28,.46],skyB:[.95,.62,.42],seaA:[.55,.38,.40],seaB:[.14,.16,.30],sunC:[1,.62,.34],sunP:[.5,.66],nite:.1},
    night:{skyT:[.05,.08,.16],skyB:[.13,.20,.34],seaA:[.10,.18,.28],seaB:[.03,.07,.14],sunC:[.85,.9,1],sunP:[.3,.85],nite:1}
  };
  let curM=JSON.parse(JSON.stringify(MOODS.night)),tgtM=MOODS.night;
  function size(){
    const dpr=Math.min(1.5,window.devicePixelRatio||1);
    cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
    gl.viewport(0,0,cv.width,cv.height);
  }
  addEventListener('resize',size);size();
  const lerp=(a,b,t)=>a+(b-a)*t;
  let t0=performance.now();
  function frame(){
    const t=(performance.now()-t0)/1000;
    for(const k of ['skyT','skyB','seaA','seaB','sunC','sunP']){
      for(let i=0;i<curM[k].length;i++) curM[k][i]=lerp(curM[k][i],tgtM[k][i],.02);
    }
    curM.nite=lerp(curM.nite,tgtM.nite,.02);
    gl.uniform2f(U.R,cv.width,cv.height);
    gl.uniform1f(U.T,t);
    gl.uniform3fv(U.skyT,curM.skyT);gl.uniform3fv(U.skyB,curM.skyB);
    gl.uniform3fv(U.seaA,curM.seaA);gl.uniform3fv(U.seaB,curM.seaB);
    gl.uniform3fv(U.sunC,curM.sunC);gl.uniform2fv(U.sunP,curM.sunP);
    gl.uniform1f(U.nite,curM.nite);
    gl.drawArrays(gl.TRIANGLES,0,3);
    if(!reduce) requestAnimationFrame(frame);
  }
  frame();
  if(reduce){ setInterval(frame,800); }
  return { set(mood){ tgtM=MOODS[mood]||MOODS.travel; } };
})();

/* ══════════ 게임 엔진 ══════════ */
const $=id=>document.getElementById(id);
const state={hp:60,obs:0,rec:0,yen:10000,idx:-1,stamps:[],flags:{},axis:[0,0,0],visited:new Set(),lastDay:'',lock:false};
const AXNAME=['축1 · 트렌드의 현재','축2 · 디자인의 원류','축3 · 지역×산업×디자인'];
const AXMAX=[48,65,68];

function fmt(n){return '¥'+n.toLocaleString('en-US');}
function popStat(el,delta,isYen){
  const p=$(el);if(!p)return;
  p.textContent=(delta>0?'+':'')+(isYen?fmt(delta).replace('¥-','-¥'):delta);
  p.className='pop show '+(delta>0?'up':'dn');
  setTimeout(()=>{p.className='pop';},1150);
}
function applyFx(fx,axis){
  if(!fx)return;
  if(fx.hp){state.hp=Math.max(0,Math.min(100,state.hp+fx.hp));popStat('p-hp',fx.hp);}
  if(fx.obs){state.obs=Math.max(0,state.obs+fx.obs);popStat('p-obs',fx.obs);}
  if(fx.rec){state.rec=Math.max(0,state.rec+fx.rec);popStat('p-rec',fx.rec);}
  if(fx.yen){state.yen=Math.max(0,state.yen+fx.yen);popStat('p-yen',fx.yen,true);}
  if(axis){state.axis[axis-1]+=Math.max(fx.obs||0,fx.rec||0,4);}
  syncHud();
}
function syncHud(){
  $('s-hp').textContent=state.hp;
  $('s-hpbar').style.width=state.hp+'%';
  $('s-obs').textContent=state.obs;
  $('s-rec').textContent=state.rec;
  $('s-yen').textContent=fmt(state.yen);
  $('stampcnt').textContent=state.stamps.length;
  $('progbar').style.width=(Math.max(0,state.idx+1)/(SC.length+1))*100+'%';
}
let stampTimer=null;
function showStamp(n){
  const fx=$('stampfx');
  if(stampTimer){clearTimeout(stampTimer);}
  fx.innerHTML='<div class="stamp"><div class="no">SETOUCHI · No.'+(n+1)+'</div><div class="nm">'+STAMPS[n].replace('\n','<br>')+'</div><div class="dt">POHANG GAUDI 2026</div></div>';
  fx.style.display='flex';
  AudioFX.sfx('stamp');
  stampTimer=setTimeout(()=>{fx.style.display='none';stampTimer=null;},1400);
}
function dayFx(s){
  if(!s.day||s.day===state.lastDay) return;
  state.lastDay=s.day;
  if(s.day.indexOf('DAY')!==0) return;
  $('df1').textContent='SETOUCHI ART TRIP';
  $('df2').textContent=s.day.split('·')[0].trim();
  $('df3').textContent=s.day.split('·')[1]?s.day.split('·')[1].trim()+' — '+s.loc:s.loc;
  const el=$('dayfx');
  el.classList.remove('on');void el.offsetWidth;el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'),1800);
}

   '<p class="meta">2026. 8. 3 (월) — 8. 6 (목) · 부산 ⇄ 마쓰야마</p>'+

  '</div>';
  $('startbtn').addEventListener('click',()=>{
    AudioFX.unlock();AudioFX.sfx('good');
    state.started=true;state.idx=0;renderScene();
  });
}
const MOODOF={travel:'travel',museum:'museum',onsen:'onsen',night:'night'};
function renderScene(){
  const s=SC[state.idx];
  if(!s){renderEnd();return;}
  state.lock=false;
  $('hud').style.display='block';
  $('h-day').textContent=s.day;
  $('h-loc').textContent=s.loc;
  $('h-time').textContent=s.time;
  if(s.map!==undefined) state.visited.add(s.map);
  syncHud();
  AudioFX.playBgm(s.bgm||'travel');
  Sea.set(MOODOF[s.bgm]||'travel');
  AudioFX.sfx('page');
  dayFx(s);

  let html='<section class="scene"><div class="kicker">'+s.kicker+'</div>';
  if(s.photo&&PHOTOS[s.photo]){
    const c=PHCAP[s.photo]||['',''];
    html+='<figure class="ph"><img src="'+PHOTOS[s.photo]+'" alt="'+c[0]+'">'+
      '<figcaption>'+c[0]+' · '+c[1]+'</figcaption></figure>';
  }
  html+='<h2 class="serif">'+s.title+'</h2><p>'+s.text+'</p>';
  if(s.tip) html+='<div class="tip">'+s.tip+'</div>';
  html+='<div class="choices" id="chs">';
  const order=s.choices.map((_,i)=>i);
  for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  order.forEach(i=>{const c=s.choices[i];
    let ok=true;
    if(c.req_hp&&state.hp<c.req_hp) ok=false;
    html+='<button type="button" class="ch" data-i="'+i+'" '+(ok?'':'disabled style="opacity:.45"')+'>'+c.t+
      (c.sub?'<span class="sub">'+c.sub+'</span>':'')+
      (!ok?'<span class="sub">체력이 부족합니다 (필요 '+c.req_hp+')</span>':'')+
      '</button>';
  });
  html+='</div><div id="fbwrap"></div></section>';
  $('stage').innerHTML=html;
  if(s.stamp!==undefined&&!state.stamps.includes(s.stamp)){
    state.stamps.push(s.stamp);
    setTimeout(()=>showStamp(s.stamp),350);
    syncHud();
  }
  document.querySelectorAll('#chs .ch').forEach(b=>{
    b.addEventListener('click',()=>choose(parseInt(b.dataset.i,10)));
  });
  window.scrollTo({top:0,behavior:'smooth'});
}
function choose(i){
  if(state.lock) return;
  state.lock=true;
  const s=SC[state.idx],c=s.choices[i];
  let fb=c.fb,useAlt=false;
  if(c.needFlag!==undefined&&!state.flags[c.needFlag]){fb=c.alt;useAlt=true;}
  if(fb===null||fb===undefined){state.idx++;renderScene();return;}
  AudioFX.sfx(useAlt?(fb.k==='bad'?'bad':'click'):(c.sfx||'click'));
  if(!useAlt){ applyFx(c.fx,c.axis); if(c.flag)state.flags[c.flag]=true; }
  document.querySelectorAll('#chs .ch').forEach(b=>{b.disabled=true;b.style.opacity=(b.dataset.i==i)?'1':'.4';});
  $('fbwrap').innerHTML='<div class="fb '+fb.k+'"><b>'+(fb.k==='good'?'👍 좋은 선택':fb.k==='bad'?'💦 이런…':'📝 메모')+'</b>'+fb.t+
    '</div><div class="choices"><button type="button" class="ch primary" id="nextbtn">계속 →</button></div>';
  $('nextbtn').addEventListener('click',()=>{state.idx++;renderScene();});
  $('nextbtn').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function renderEnd(){
  AudioFX.playBgm('onsen');Sea.set('onsen');AudioFX.sfx('fanfare');
  const score=state.obs+state.rec+(state.hp>=70?10:state.hp>=40?5:0)+state.stamps.length*2;
  let g,gt;
  if(score>=230){g='S';gt='관찰 장인 — 미술활동보고서가 저절로 써질 기록량!';}
  else if(score>=185){g='A';gt='훌륭한 여행자 — 조금만 다듬으면 빛나는 보고서.';}
  else if(score>=120){g='B';gt='무난한 완주 — 진짜 여행에선 한 걸음 더 깊게!';}
  else{g='C';gt='관광은 성공, 수업은 글쎄 — 교재를 다시 읽고 재도전?';}
  let axesHtml='';
  state.axis.forEach((v,i)=>{
    const pct=Math.min(100,Math.round(v/AXMAX[i]*100));
    axesHtml+='<div class="axis"><div class="an"><span>'+AXNAME[i]+'</span><span>'+pct+'%</span></div>'+
      '<div class="ab"><i style="width:0" data-w="'+pct+'"></i></div></div>';
  });
  const souvenirs=[state.flags.denim?'고지마 데님 파우치':null,state.flags.liquid?'미칸 사이다':null,state.flags.towel?'이마바리 타월':null].filter(Boolean);
  $('hud').style.display='block';syncHud();
  $('h-day').textContent='여행 종료';$('h-loc').textContent='포항으로';$('h-time').textContent='19:55';
  $('stage').innerHTML=
  '<section class="scene report"><div class="kicker">TRAVEL REPORT · 결과</div>'+
   '<div class="grade serif">'+g+'</div><div class="gsub">'+gt+'</div>'+
   '<div class="rline"><span>관찰 점수</span><b>'+state.obs+'</b></div>'+
   '<div class="rline"><span>기록 점수</span><b>'+state.rec+'</b></div>'+
   '<div class="rline"><span>남은 체력</span><b>'+state.hp+'</b></div>'+
   '<div class="rline"><span>남은 지갑</span><b>'+fmt(state.yen)+'</b></div>'+
   '<div class="rline"><span>모은 도장</span><b>'+state.stamps.length+' / 8</b></div>'+
   (souvenirs.length?'<div class="rline"><span>기념품</span><b>'+souvenirs.join(', ')+'</b></div>':'')+
   '<div class="axes">'+axesHtml+'</div>'+
   '<div class="mihwal"><div class="mh">미술활동보고서 미리보기 · 한 줄</div>'+
    '"세토내해의 건축·미술관·지역산업을 관찰하며 '+(state.rec>=4?('현장드로잉 '+Math.max(1,Math.round(state.rec/8))+'점을 남겼고, '):'눈으로 오래 담았고, ')+
    (state.axis[2]/AXMAX[2]>=state.axis[0]/AXMAX[0]&&state.axis[2]/AXMAX[2]>=state.axis[1]/AXMAX[1]
      ?'일본의 지역이 디자인으로 살아나는 과정을 내가 사는 포항의 질문으로 가져왔다.'
      :state.axis[1]/AXMAX[1]>=state.axis[0]/AXMAX[0]
        ?'원작 관찰을 통해 디자인이 어디에서 왔는지를 내 전공의 언어로 정리했다.'
        :'재생·지속가능 디자인이라는 동시대의 흐름을 현장에서 확인했다.')+'"'+
   '</div>'+
   '<div class="tip">진짜 여행에서는 이 모든 걸 눈과 손으로 하게 됩니다. 교재 제3장을 읽고 가면, 같은 장소에서 다른 것이 보여요.</div>'+
   '<div class="choices"><button type="button" class="ch primary" id="againbtn">처음부터 다시</button></div></section>';
  document.querySelectorAll('.axis .ab i').forEach(el=>{
    requestAnimationFrame(()=>{setTimeout(()=>{el.style.width=el.dataset.w+'%';},80);});
  });
  $('againbtn').addEventListener('click',()=>{
    Object.assign(state,{hp:60,obs:0,rec:0,yen:10000,idx:-1,stamps:[],flags:{},axis:[0,0,0],visited:new Set(),lastDay:'',lock:false});
    renderTitle();
  });
}

/* 모달 */
function openModal(id){$(id).style.display='flex';AudioFX.sfx('click');}
document.querySelectorAll('.modal .close').forEach(b=>b.addEventListener('click',()=>{$(b.dataset.close).style.display='none';AudioFX.sfx('click');}));
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.style.display='none';}));
$('stampbook').addEventListener('click',()=>{
  $('bookgrid').innerHTML=STAMPS.map((s,i)=>'<div class="cell'+(state.stamps.includes(i)?' got':'')+'">'+s.replace('\n','<br>')+'</div>').join('');
  openModal('book');
});
$('mapbtn').addEventListener('click',()=>{
  const cur=(state.idx>=0&&SC[state.idx])?SC[state.idx].map:undefined;
  $('pins').innerHTML=MAPSTOPS.map((p,i)=>{
    const cls=i===cur?'pin here':(state.visited.has(i)?'pin visited':'pin');
    const ly=p.y<125?p.y-9:p.y+15;
    return '<circle class="'+cls+'" cx="'+p.x+'" cy="'+p.y+'" r="6"></circle>'+
      '<text class="plabel" x="'+p.x+'" y="'+ly+'" text-anchor="middle">'+p.n+'</text>';
  }).join('');
  openModal('map');
});
$('mute').addEventListener('click',()=>{
  const m=AudioFX.toggle();
  $('mute').textContent=m?'소리 끔':'소리 켬';
  if(!m)AudioFX.sfx('click');
});

document.addEventListener('pointerdown',()=>AudioFX.unlock(),{passive:true});
renderTitle();
</script>
